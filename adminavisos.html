<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de avisos</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>

    <script src="js/checksession.js"></script>
    <script src="js/adminavisos.js"></script>
    <link rel="stylesheet" href="css/dialogoestilo.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.0/themes/base/jquery-ui.css">
    <script src="//code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="//code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="css/celdas.css">
    <link rel="stylesheet" href="css/paginacion.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Convergence&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/fondo.css">
    <script src="js/totop.js"></script>
  <link rel="stylesheet" href="css/totop.css">
  <link rel="stylesheet" href="css/dialogoui.css">

</head>

<body>
    <div id="menu"></div>

    <div id="btn-arriba">
        <img src="media/totop.jpg" width="128px" height="128px" alt="Ir Arriba">
      </div>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="display-4">AVISOS</h1>
                <hr>
            </div>
        </div>
        <!-- VERSION ADMINISTRADOR A SECAS -->


        <div class="row">

            <div class="col-md-12">
                <div class="table-responsive">
                    <table id="avisos" class="table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Titulo</th>
                                <th scope="col">Aviso</th>
                                <th scope="col">Fecha publicacion</th>
                                <th scope="col">Usuario</th>
                                <th><button type="button" id="anadir">Añadir</button></th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
                <div id="paginacion">
                    <!-- Aquí se agregarán los botones de paginación con JavaScript -->
                </div>
            </div>
        </div>


        <!-- VERSION EL RESTO NO USUARIO -->
        <div class="row">

            <div class="col-md-10">
                <div id="avisoscreados">

                </div>

            </div>

        </div>
        <div class="row">
            <div class="col-md-6">
                <button id="cargar-mas-aviso" style="display: none;">Cargar más</button>
            </div>
        </div>


        <!-- Diálogo modal -->
        <div id="addform" class="modal">
            <div class="modal-content">
                <span class="close" id="close">&times;</span>
                <form action="adminavisos.html" method="post" id="addaviso">

                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" placeholder="Titulo">

                    <label for="aviso">Aviso</label>
                    <input type="text" name="aviso" id="aviso" placeholder="Aviso">
                    <input id="btadd" type="button" value="Añadir">

                </form>
            </div>
        </div>
        <!-- Diálogo modal -->
        <div id="editform" class="modal">
            <div class="modal-content">
                <span class="close" id="close">&times;</span>
                <form action="adminavisos.html" method="post" id="editaviso">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" placeholder="Titulo">
                    <label for="aviso">Aviso</label>
                    <input type="text" name="aviso" id="aviso" placeholder="Titulo">
                    <input id="btedit" type="button" value="Editar">
                </form>
            </div>
        </div>





    </div>




    <footer class="bg-light py-3">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>ARTISTAPP</p>
                    <p>Contacto: <a href="tel:+34 000 000 000">+34 000 000 000</a></p>
                    <p>Email: <a href="mailto:contacto@example.test">contacto@example.test</a></p>
                    <p>© 2023 Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </footer>


</body>

</html>
