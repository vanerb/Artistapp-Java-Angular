spring.application.name=artistapp-api
server.port=${PORT:8000}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Base de datos MySQL / MariaDB con el esquema histórico de ArtistApp.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:vrb_artistapp}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=LOCAL&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Formularios con archivos: Laravel enviaba PATCH como POST + _method.
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Días que dura una sesión antes de tener que volver a entrar.
artistapp.token-days=${TOKEN_DAYS:30}
artistapp.frontend-url=${FRONTEND_URL:http://localhost:4200}
artistapp.storage-path=${STORAGE_PATH:storage/app}

# Cuenta de administración opcional que se crea al arrancar.
artistapp.admin.name=${ADMIN_NAME:Administración}
artistapp.admin.username=${ADMIN_USERNAME:admin}
artistapp.admin.email=${ADMIN_EMAIL:}
artistapp.admin.password=${ADMIN_PASSWORD:}

# Correo: con MAIL_HOST vacío los correos se escriben en el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
artistapp.mail.from=${MAIL_FROM_ADDRESS:noreply@artistapp.local}
